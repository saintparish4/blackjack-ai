# Blackjack AI - Default Training Configuration
# Lines starting with # are comments. Keys and values are whitespace-trimmed.
# Priority: CLI flags > config file > built-in defaults.

# ---- Reproducibility ----
# Seeds the agent's exploration, the training shoe and every evaluation shoe,
# so the same config and seed reproduce a run exactly. Unset = a fresh,
# nondeterministic run each time. --seed on the command line overrides it.
# seed              = 1

# ---- Training ----
episodes            = 1000000
eval_frequency      = 10000
eval_games          = 1000
checkpoint_frequency = 50000
checkpoint_dir      = ./checkpoints
log_dir             = ./logs
verbose             = true

# Stop training early if the metric doesn't improve for N consecutive evaluations.
#   accuracy: policy-audit agreement with basic strategy. No sampling noise, so
#             it only moves when the greedy policy does.
#   ev:       mean reward per round over eval_games. Noisy: at 1,000 games a
#             95% CI is about +/-0.07, so lucky evaluations keep resetting
#             patience unless eval_games is large.
# Win rate is deliberately not an option: it saturates near 43% within the
# first few evaluations whatever the policy is doing.
early_stopping_metric   = accuracy
early_stopping_patience = 10
# Minimum gain that counts as improvement, in the metric's own units
# (0.001 = 0.1 percentage points of accuracy, or 0.001 units of EV).
min_improvement     = 0.001

# Rounds per policy (agent, basic strategy, random) in the end-of-run EV
# comparison written to the training report.
eval_rounds         = 200000

# ---- Agent Hyperparameters ----
# Agent type. All three are tabular and save the same model format:
#   q-learning      bootstraps from the best next action (off-policy)
#   expected-sarsa  bootstraps from the expected next value under ε-greedy
#   double-q        two tables; one picks the next action, the other values it
agent               = q-learning
# Step size. constant: every update uses learning_rate.
#            visit:    α = max(alpha_min, 1/(1+n)^alpha_omega), n = updates so
#                      far to that (state, action). learning_rate is unused.
# Visit-scaled is the default: it beat constant α on every config in
# experiment 001 (-0.026 vs -0.040 EV per round for this file, 5 seeds).
alpha_schedule      = visit
alpha_omega         = 1.0     # visit only; in (0, 1]. 1 = plain sample mean
alpha_min           = 0.0     # visit only; floor on α
learning_rate       = 0.1     # constant only
# Card counting (experiment 002). Both off: a count-blind, flat-betting player.
#   use_count:  put the Hi-Lo true count (floor, clamped to -3..+6) in the state,
#               so play can depend on it. Multiplies the state space by ten.
#   learn_bets: after training, play bet_calibration_rounds greedy rounds to
#               measure the agent's own edge at each count, then bet max_bet
#               where it's positive and the minimum elsewhere.
use_count           = false
learn_bets          = false
bet_calibration_rounds = 2000000
discount_factor     = 0.95
epsilon             = 1.0
epsilon_decay       = 0.99995
epsilon_min         = 0.01

# ---- Game Rules ----
# Preset name selects a known rule set. Supported values:
#   vegas-strip, downtown, atlantic-city, european, single-deck
rules_preset        = vegas-strip

# Individual rule overrides (uncomment to apply on top of the preset):
# num_decks           = 6
# dealer_hits_soft_17 = false
# surrender           = false
# blackjack_payout    = 1.5     # 3:2. A 6:5 table is 1.2; rewards use this value
# penetration         = 0.75    # fraction of the shoe dealt before a reshuffle
# max_bet             = 1       # bet spread in units of the minimum; 1 = flat.
#                               # Above 1, runs also report EV per unit wagered
#                               # and the Hi-Lo baselines
