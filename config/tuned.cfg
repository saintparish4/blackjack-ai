# Blackjack AI - Tuned Training Configuration
#
# Settings used to produce the numbers and plots in the README. default.cfg
# converges fast but stops early and plateaus lower; this config trades runtime
# for accuracy.
#
# Reproduce the published run exactly (same seed, same numbers):
#   ./build/train --config ../config/tuned.cfg
# Measure the run-to-run spread over five seeds:
#   ./build/experiment --config ../config/tuned.cfg --seeds 5

# ---- Reproducibility ----
# Seeds the agent's exploration, the training shoe and every evaluation shoe.
# Remove it (or pass a different --seed) for a fresh, nondeterministic run.
seed                = 1

# ---- Training ----
episodes            = 5000000
eval_frequency      = 25000
eval_games          = 2000
checkpoint_frequency = 250000
checkpoint_dir      = ./checkpoints
log_dir             = ./logs
verbose             = true

# Early stopping watches policy-audit accuracy (agreement with basic strategy),
# which only moves when the greedy policy changes. "ev" is the alternative; it
# is a sample mean over eval_games, so it needs eval_games in the tens of
# thousands before noise stops resetting patience. Patience is high here so the
# published run always trains the full 5M episodes: accuracy wobbles by a state
# or two long after EV has settled.
early_stopping_metric   = accuracy
early_stopping_patience = 200
# In the metric's units: 0.001 = 0.1 percentage points of accuracy.
min_improvement     = 0.001

# Rounds per policy (agent, basic strategy, random) in the end-of-run EV
# comparison. 200k gives a 95% CI of about +/-0.005 per round.
eval_rounds         = 200000

# ---- Q-Learning Hyperparameters ----
agent               = q-learning
# Lower learning rate than default: the remaining divergences are states where
# the top two Q-values sit within ~0.1 of each other, and a large step size
# keeps knocking the argmax back and forth instead of settling.
learning_rate       = 0.05
discount_factor     = 0.95
epsilon             = 1.0
# Decays to epsilon_min at roughly 2M episodes, leaving 3M episodes of mostly
# greedy play to sharpen the policy.
epsilon_decay       = 0.9999985
# Held above default (0.01) so rare states — soft totals in particular — keep
# accumulating visits through the back half of the run.
epsilon_min         = 0.05

# ---- Game Rules ----
rules_preset        = vegas-strip
# Per-field overrides on top of the preset (see default.cfg for the full list):
# blackjack_payout  = 1.5       # 1.2 for a 6:5 table
# penetration       = 0.75      # fraction of the shoe dealt before a reshuffle
