name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            cc: gcc
          - compiler: clang++
            cc: clang

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          cmake --version
          ${{ matrix.compiler }} --version

      # googletest is pulled in via FetchContent; caching the populated _deps
      # tree keeps the clone+build off the critical path on repeat runs.
      - name: Cache googletest
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-${{ matrix.compiler }}-deps-${{ hashFiles('core/CMakeLists.txt') }}

      # -Werror is opt-in so that cloning the repo on a newer compiler does not
      # fail on an unrelated warning. CI is where it belongs, so turn it on.
      - name: Configure
        run: >
          cmake -B build -S core
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DBLACKJACK_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel "$(nproc)"

      # Exercises the full train -> evaluate -> report -> save pipeline, which
      # the unit tests only cover in pieces.
      - name: Smoke test training pipeline
        working-directory: core
        run: |
          ../build/train --episodes 20000
          test -f models/final_agent.qtable
          test -f analysis/q_table.csv

      - name: Smoke test strategy report
        working-directory: core
        run: ../build/play --report --model ./models/final_agent

      # The lab bench's contract is that (config, seed) fixes every number.
      # Run the same small experiment twice and require identical output.
      - name: Smoke test experiment runner is deterministic
        working-directory: core
        run: |
          for run in a b; do
            ../build/experiment --config ../config/default.cfg --seeds 2 \
              --episodes 20000 --eval-rounds 20000 --out /tmp/exp-$run --name smoke \
              | grep -v '^Output\|^Wrote' > /tmp/exp-$run.txt
          done
          diff /tmp/exp-a/smoke/results.csv /tmp/exp-b/smoke/results.csv
          diff /tmp/exp-a.txt /tmp/exp-b.txt

      # The card-counting path: a counting, bet-learning agent against both
      # Hi-Lo baselines with a 1-8 spread, also required to be deterministic.
      - name: Smoke test card counting
        working-directory: core
        run: |
          # extends resolves relative to the config file, which lives in /tmp.
          printf 'extends = %s/../config/default.cfg\nmax_bet = 8\nuse_count = true\nlearn_bets = true\nbet_calibration_rounds = 20000\n' "$PWD" > /tmp/count.cfg
          for run in a b; do
            ../build/experiment --config /tmp/count.cfg --seeds 2 --episodes 20000 \
              --eval-rounds 20000 --out /tmp/count-$run --name smoke > /dev/null
          done
          diff /tmp/count-a/smoke/results.csv /tmp/count-b/smoke/results.csv
          diff /tmp/count-a/smoke/count_profile.csv /tmp/count-b/smoke/count_profile.csv

  sanitizers:
    name: asan+ubsan / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The unit tests exercise pointer-heavy agent dispatch, binary
      # serialisation and a flat Q-table indexed by a packed hash. -Wall cannot
      # see an out-of-bounds index into that table; ASan can.
      - name: Configure
        run: >
          cmake -B build -S core
          -DCMAKE_BUILD_TYPE=Debug
          -DBLACKJACK_WERROR=ON
          -DBLACKJACK_SANITIZE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure --parallel "$(nproc)"

      - name: Short training run under sanitizers
        working-directory: core
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ../build/train --episodes 5000
