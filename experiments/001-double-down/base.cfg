# Experiment 001's frozen starting point: config/tuned.cfg as it stood when
# the experiment ran (2026-09-19). Arms extend this file rather than
# tuned.cfg, so later changes to the published config can't move them.

# ---- Training ----
episodes                = 5000000
eval_frequency          = 25000
eval_games              = 2000
verbose                 = false
early_stopping_metric   = accuracy
early_stopping_patience = 200
min_improvement         = 0.001
eval_rounds             = 200000

# ---- Agent ----
agent               = q-learning
alpha_schedule      = constant
learning_rate       = 0.05
discount_factor     = 0.95
epsilon             = 1.0
epsilon_decay       = 0.9999985
epsilon_min         = 0.05

# ---- Rules ----
rules_preset        = vegas-strip
