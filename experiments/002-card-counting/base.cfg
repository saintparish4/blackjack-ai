# Experiment 002's frozen starting point: config/tuned.cfg as it stood after
# experiment 001 (visit-scaled alpha), plus a 1-8 bet spread. Arms extend this
# file, so later changes to the published config can't move them.

# ---- Training ----
episodes                = 5000000
eval_frequency          = 25000
eval_games              = 2000
verbose                 = false
early_stopping_metric   = accuracy
early_stopping_patience = 200
min_improvement         = 0.001
# Five policies are measured per seed (agent, flat basic strategy, random,
# Hi-Lo, Hi-Lo + I18). A 1-8 spread roughly doubles the per-round noise per
# unit bet, so each gets 10M rounds: a 95% CI near +/-0.0014 per seed.
eval_rounds             = 10000000

# ---- Agent ----
agent               = q-learning
alpha_schedule      = visit
alpha_omega         = 1.0
alpha_min           = 0.0
learning_rate       = 0.05
discount_factor     = 0.95
epsilon             = 1.0
epsilon_decay       = 0.9999985
epsilon_min         = 0.05
use_count           = false
learn_bets          = false
# The TC >= +6 bucket turns up in about 1% of rounds; 10M greedy rounds give
# it about 100k samples, enough to tell a 2% edge from zero.
bet_calibration_rounds = 10000000

# ---- Rules ----
rules_preset        = vegas-strip
max_bet             = 8
penetration         = 0.75
