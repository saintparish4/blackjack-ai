# 005 arm: warm start. Every bucket starts from the published count-blind
# model with a pseudo-count of 100 samples, so Q = (100 Q0 + sum of targets)
# / (100 + n). That is also "deviation learning" with Q0 frozen: the same
# estimator, so one arm answers both.
extends = ../base.cfg
count_prior = frozen
count_prior_visits = 100
count_prior_model = ../web/model/agent
